name: Befehle auf aktuellem Arch prüfen

# Arch ist eine Rolling-Release-Distribution. Einmal im Monat (und bei Änderungen an Missionen oder Tests)
# laufen alle Befehle aus tests/befehle.sh in einem frischen Arch-Container.
# Ein roter Lauf heißt: Eine Anleitung im Kurs passt nicht mehr zum aktuellen Arch.
on:
  schedule:
    - cron: '17 4 3 * *'   # am 3. jedes Monats, 04:17 UTC
  push:
    branches: [main]
    paths: ['tests/**', 'src/missionen/**', '.github/workflows/befehle.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Befehle ausführen
        run: bash tests/befehle.sh

  melden:
    needs: arch
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Issue anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Befehlsprüfung fehlgeschlagen ($(date +%Y-%m))" \
            --body "Die monatliche Prüfung auf aktuellem Arch ist fehlgeschlagen: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Bitte die betroffene Mission anpassen."
