name: Befehle auf Debian prüfen

# Einmal im Monat (und bei Änderungen an Missionen oder Tests) laufen alle Befehle aus tests/befehle.sh
# in frischen Debian-Containern: einmal Debian 13, für das der Kurs geschrieben ist, und einmal
# "stable". Sobald Debian 14 erscheint, zeigt der zweite Lauf, ob die Anleitungen noch passen.
on:
  schedule:
    - cron: '17 4 3 * *'   # am 3. jedes Monats, 04:17 UTC
  push:
    branches: [main]
    paths: ['tests/**', 'src/missionen/**', 'src/scripts/shell.ts', '.github/workflows/befehle.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  debian:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abbild: ['debian:13', 'debian:stable']
    container: ${{ matrix.abbild }}
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Befehle ausführen
        run: bash tests/befehle.sh

  melden:
    needs: debian
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Issue anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Befehlsprüfung fehlgeschlagen ($(date +%Y-%m))" \
            --body "Die monatliche Prüfung auf Debian ist fehlgeschlagen: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Bitte die betroffene Mission anpassen."
